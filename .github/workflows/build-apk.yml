name: Build Bradnams APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reconstruct calculator HTML
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat app/src/main/assets_parts/part*.b64 | tr -d '\n\r ' | base64 -d > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q "Bradnam's 52mm & 100mm Raked Fixed Lite Calculator" app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raked-Lite-Calc-v1.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
